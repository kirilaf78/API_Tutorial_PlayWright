name: Playwright API Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright dependencies
      # Для API-тестов нам не нужны сами браузеры (Chromium/Firefox), 
      # но нужны системные библиотеки для корректной работы Playwright.
      run: npx playwright install-deps

    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Сюда впишите базовый URL вашего API, если он не указан в playwright.config.ts
        BASE_URL: 'https://ваш-публичный-апи.com'

    - name: Upload Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
